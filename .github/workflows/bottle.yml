name: Bottle release verification
on:
  workflow_dispatch:
  push:
    branches: [codex/rebuild]
    paths:
      - ".github/workflows/bottle.yml"
      - "visionguard/**"
      - "configs/**"
      - "scripts/**"
      - "pyproject.toml"
      - "Dockerfile"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.10.12
      - name: Install CPU dependencies
        run: uv sync --python 3.13 --group prepare --group browser
      - name: Check the actual PatchCore adapter
        run: uv run --no-sync python -m pytest -m ml -q
      - name: Fetch pinned data and weights
        run: |
          uv run --no-sync python -m scripts.fetch_bottle
          uv run --no-sync python -m scripts.dataset --dataset data/mvtec/bottle
      - name: Freeze and evaluate the serving graph
        run: |
          uv run --no-sync python -m scripts.prepare --config configs/bottle.toml --dataset data/mvtec/bottle --weights data/resnet18.a1_in1k.safetensors --output artifacts/bottle-pc-v1
          uv run --no-sync python -m scripts.evaluate --dataset data/mvtec/bottle --artifact artifacts/bottle-pc-v1 --category bottle --version bottle-pc-v1 --output outputs/bottle-evaluation.json
          uv run --no-sync python -m scripts.stage_examples --dataset data/mvtec/bottle
      - name: Measure warm HTTP latency, startup and process RSS
        run: uv run --no-sync python -m scripts.benchmark --dataset data/mvtec/bottle
      - name: Exercise actual serving workflow in Chromium
        run: |
          uv run --no-sync playwright install --with-deps chromium
          uv run --no-sync python -m scripts.verify_browser --dataset data/mvtec/bottle --output outputs
      - name: Build and smoke test the Linux image without network
        run: |
          docker build -t visionguard:verify .
          docker run -d --name visionguard-verify --network none -v "$PWD/artifacts:/models:ro" visionguard:verify
          trap 'docker logs visionguard-verify; docker rm -f visionguard-verify' EXIT
          for i in $(seq 1 25); do
            if docker exec visionguard-verify python -c "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/ready').status == 200"; then break; fi
            sleep 1
          done
          docker exec -i visionguard-verify python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen
          for name in ("normal", "defect"):
              data = Path(f"/models/samples/bottle/{name}.png").read_bytes()
              req = Request("http://127.0.0.1:8000/api/predict?category=bottle", data)
              with urlopen(req, timeout=20) as response:
                  result = json.load(response)
              assert result["overlay"].startswith("data:image/png;base64,")
              print(name, result["label"], result["anomaly_score"])
          PY
      - name: Save evidence and prepared bundle for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bottle-verification
          path: |
            uv.lock
            artifacts/bottle-pc-v1
            outputs
          if-no-files-found: warn
          retention-days: 30
