name: Application checks
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.10.12
      - name: Install and test API
        run: |
          uv sync --python 3.13
          uv run --no-sync ruff check .
          uv run --no-sync python -m pytest -m "not ml" -q
          node --check visionguard/web/app.js
          node --check visionguard/web/api.js
