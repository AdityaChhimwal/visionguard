[project]
name = "visionguard"
version = "1.0.0"
description = "Category-specific industrial inspection with PatchCore"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.135.1",
  "numpy==2.4.3",
  "onnxruntime==1.24.4",
  "pillow==12.2.0",
  "python-multipart==0.0.22",
  "uvicorn==0.41.0",
]

[dependency-groups]
prepare = [
  "anomalib==2.7.0",
  "onnx==1.20.1",
  "safetensors==0.7.0",
  "scikit-learn==1.8.0",
  "timm==1.0.25",
  "torch==2.10.0",
  "torchvision==0.25.0",
]
dev = ["httpx==0.28.1", "pytest==9.0.2", "ruff==0.15.7"]
browser = ["playwright==1.58.0", "psutil==7.2.2"]

[tool.uv]
package = false
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[tool.uv.sources]
torch = {index = "pytorch-cpu"}
torchvision = {index = "pytorch-cpu"}

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ml: requires the optional preparation dependencies"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
